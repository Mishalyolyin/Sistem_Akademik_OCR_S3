# Menjalankan yang selama ini hanya dijalankan tangan di mesin pengembangan.
#
# Dua pekerjaan berjalan paralel karena keduanya tidak saling bergantung, dan
# kegagalan salah satunya tetap harus terlihat sendiri-sendiri: build frontend
# yang hijau tidak ada artinya kalau aturan uangnya sedang merah.
name: CI

on:
  push:
    branches: [main, migrasi-v2]
  pull_request:
    branches: [main]

# Dorongan baru membatalkan yang lama pada branch yang sama; hasil dari commit
# yang sudah tertimpa tidak berguna untuk siapa pun.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Runner ubuntu sudah menyediakan Docker, jadi Testcontainers di
      # ApiApplicationTests menyalakan PostgreSQL sungguhan apa adanya —
      # sekaligus memverifikasi seluruh migrasi Flyway.
      - name: Test
        working-directory: api
        run: ./mvnw -B --no-transfer-progress verify

      - name: Simpan laporan test bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api/target/surefire-reports/
          retention-days: 7

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pasang dependency
        working-directory: web
        run: npm ci

      - name: Ketikan
        working-directory: web
        run: npx tsc --noEmit

      # Lint dijalankan terpisah karena `next build` TIDAK menjalankannya —
      # itulah sebabnya lima galat React Hooks pernah menumpuk tanpa terlihat.
      - name: Lint
        working-directory: web
        run: npx eslint src/

      - name: Test unit
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
