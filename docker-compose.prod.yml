# Seluruh sistem dalam satu perintah, untuk deploy ke VPS.
#
#   cp .env.example .env      lalu isi kata sandinya
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Untuk pengembangan sehari-hari pakai docker-compose.yml biasa, yang hanya
# menyalakan database dan broker sementara aplikasinya dijalankan dari mesin.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pembayaran}
      POSTGRES_USER: ${DB_USER:-pembayaran}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?kata sandi database wajib diisi}
      TZ: Asia/Jakarta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pembayaran}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pembayaran}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?kata sandi rabbitmq wajib diisi}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  ocr:
    build: ./ocr
    restart: unless-stopped
    expose:
      - "8000"

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pembayaran}
      DB_USERNAME: ${DB_USER:-pembayaran}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pembayaran}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OCR_URL: http://ocr:8000
      STORAGE_ROOT: /app/storage
      JWT_SECRET: ${JWT_SECRET:?rahasia JWT wajib diisi, minimal 32 karakter}
      CORS_ORIGINS: ${APP_URL:-http://localhost:3000}
      # Cookie sesi hanya boleh melewati HTTPS. Tanpa ini refresh token ikut
      # terkirim di koneksi biasa dan bisa dibaca siapa pun di jaringan yang sama.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Admin pertama. Tidak ada endpoint pembuat pengguna, jadi mematikan ini
      # pada pemasangan baru berarti tidak ada jalan masuk sama sekali. Biarkan
      # menyala; ia hanya bekerja saat akun dengan email itu belum ada.
      APP_SEED_ADMIN: ${APP_SEED_ADMIN:-true}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:?email admin pertama wajib diisi}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?kata sandi admin pertama wajib diisi}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-Admin Keuangan}
    volumes:
      - bukti-bayar:/app/storage
    ports:
      # Di VPS yang memakai reverse proxy, setel API_BIND=127.0.0.1:8080 supaya
      # API tidak ikut terbuka langsung ke internet.
      - "${API_BIND:-8080}:8080"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8080/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_BIND:-3000}:3000"

volumes:
  postgres-data:
  rabbitmq-data:
  bukti-bayar:
