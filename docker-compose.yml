# Infrastruktur untuk pengembangan lokal.
# Aplikasi (api/, web/, ocr/) dijalankan langsung dari mesin supaya hot-reload cepat;
# yang di-container hanya database dan broker. Container untuk aplikasi ditambahkan
# menjelang deploy (Fase 6).
#
#   docker compose up -d
#   docker compose down          (data tetap tersimpan di volume)
#   docker compose down -v       (hapus data juga)

services:
  postgres:
    image: postgres:16-alpine
    container_name: pembayaran-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pembayaran
      POSTGRES_USER: pembayaran
      POSTGRES_PASSWORD: pembayaran
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pembayaran -d pembayaran"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pembayaran-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pembayaran-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pembayaran
      RABBITMQ_DEFAULT_PASS: pembayaran
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Panel admin: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
